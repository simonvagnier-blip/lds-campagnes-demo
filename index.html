<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex, nofollow">
  <style>html.gate-lock #root,html.gate-lock #modal-root,html.gate-lock #toast-root{display:none!important}
  #gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#0A0F1E;font-family:Poppins,system-ui,sans-serif}
  #gate form{background:#fff;border-radius:12px;padding:32px 36px;width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  #gate img{height:30px;margin-bottom:18px}#gate h1{font-size:18px;margin:0 0 6px;color:#0F172A}#gate p{font-size:13px;color:#64748B;margin:0 0 18px}
  #gate input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #CBD5E1;border-radius:8px;font-size:14px}
  #gate button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;background:#233F93;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  #gate .err{color:#E5484D;font-size:12px;min-height:16px;margin-top:8px}</style>
  <script>(function(){if(sessionStorage.getItem('lds-gate')==='ok')return;document.documentElement.classList.add('gate-lock');})();</script>
</head>
<body>
<div id="gate" style="display:none"><form id="gate-f" autocomplete="off">
  <img src="assets/img/logo-livedata.svg" alt="Live Data"><h1>LDS Campagnes — accès test</h1>
  <p>Maquette interne Live Data Solutions. Données fictives, aucun envoi réel.</p>
  <input type="password" id="gate-p" placeholder="Mot de passe d'accès" aria-label="Mot de passe d'accès" autofocus>
  <button type="submit">Entrer</button><div class="err" id="gate-e"></div></form></div>
<script>(function(){var H='84170d6dd6772fc12a6b4b3b47c285286a9e2e12fbaffbd60661dda29465c481';var g=document.getElementById('gate');
if(sessionStorage.getItem('lds-gate')==='ok'){g.remove();return;}g.style.display='flex';
document.getElementById('gate-f').onsubmit=function(e){e.preventDefault();var v=document.getElementById('gate-p').value;
crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(b){var h=Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
if(h===H){sessionStorage.setItem('lds-gate','ok');document.documentElement.classList.remove('gate-lock');g.remove();}else{document.getElementById('gate-e').textContent='Mot de passe incorrect.';}});};})();</script>

  <div id="root"></div>

</body>
